name: Validate

# Catches drift between the committed test vectors and what a spec-compliant
# implementation produces. Runs on every push + PR.
#
# For each vector in test-vectors/, re-canonicalize the poll/ballot/reveal
# with sig.value emptied, recompute SHA-256, and assert it matches the
# vector's expected_*_id. This is the protocol's own conformance gate;
# separately, @orangecheck/vote-core runs the same fixtures as vitest
# conformance in oc-packages/vote-core/src/test-vectors.test.ts.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    vectors:
        name: Re-derive ids from canonical bytes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'

            - name: Validate every test vector
              run: node scripts/validate-vectors.mjs

    home-paths:
        # A path into someone's home directory names a person in a public repo
        # and works on one machine only. Use a repo-relative path or an env var.
        name: No absolute home-directory paths
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            # Every commit in the history, scanned for secrets.
            - name: No secrets in the history (gitleaks 8.30.1, pinned by sha256)
              run: |
                  curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
                  "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-level warn
            - name: Fail on any tracked file that has one
              run: |
                  if git grep -nIE '(^|[^A-Za-z0-9_.:/-])/(Users|home)/[A-Za-z0-9_.-]+/' -- . ':!*.lock'; then
                      echo "::error::absolute home-directory path in a tracked file"
                      exit 1
                  fi
